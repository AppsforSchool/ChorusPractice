<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#5B6EE1">
  <title>合唱練習アプリ</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=BIZ+UDGothic:wght@400;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">

  <link rel="icon" type="image/png" sizes="32x32" href="icon-512.png">
  <link rel="apple-touch-icon" href="icon-512.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-512.png">

  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
</head>

<body>
  <div id="loading-overlay">
    <h1>loading...</h1>
    <p>ログインシステムの読み込みに時間がかかる場合があります｡</p>
  </div>

  <header id="app-header">
    <p id="header-title">合唱練習アプリ</p>
  </header>

  <main>
    <div id="login-container">
      <p id="login-title">ログイン</p>
      <p class="login-subtitle" id="to-pc">このサイトを利用するには、ログインが必要です。</p>
      <p class="login-subtitle" id="to-sp">このサイトを利用するには、<br>ログインが必要です。</p>

      <div id="login-input">
        <input type="text" id="id" placeholder="クラス名 (例: 3-1)" autocapitalize="off" autocomplete="off">
        <input type="password" id="password" placeholder="パスワード">

        <button type="submit" id="login-button" disabled="true">ログイン</button>
        <p id="error-message"></p>
      </div>
    </div>
  </main>

  <footer>
    <p>合唱練習アプリ</p>
  </footer>

  <script type="module" src="script.js"></script>
</body>
</html>
