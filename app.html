<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#5B6EE1">
  <title>合唱練習アプリ</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="icon" type="image/png" href="icon-512.png">
  <link rel="apple-touch-icon" href="icon-512.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=BIZ+UDGothic:wght@400;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="appStyle.css">

  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
</head>

<body>
  <div id="loading-overlay">
    <h1>loading...</h1>
    <p id="loading-status-text">読み込んでいます｡</p>
  </div>

  <div id="drawerOverlay" class="drawer-overlay"></div>
  <div id="accountSettingsDrawer" class="drawer">
    <div class="drawer-header">
      <p>アカウント設定</p>
      <span id="drawerCloseButton" class="drawer-close-button">&times;</span>
    </div>
    <div class="drawer-content">
      <div class="drawer-section">
        <p class="title">現在のユーザー</p>
        <p>クラス: <strong id="drawerClassId">取得中...</strong></p>

        <button id="logout-button" class="logout-button normal-button">ログアウト</button>
      </div>
    </div>
  </div>

  <header id="app-header">
    <p id="header-title">合唱練習アプリ</p>
    <div id="user-data">
      <button id="setting-button">アカウント設定</button>
    </div>
  </header>

  <main>
    <div class="books-container">
      <p class="title">曲一覧</p>

      <p id="loading-text">読み込み中...</p>
      <p id="empty-text" class="hidden">このクラスで利用できる曲はまだ登録されていません。</p>
      <div id="card-area" class="card-area hidden"></div>
    </div>
  </main>

  <script type="module" src="appScript.js"></script>
</body>
</html>
